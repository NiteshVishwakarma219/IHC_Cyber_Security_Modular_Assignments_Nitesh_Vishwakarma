{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<section class="card"><h1>Create account</h1><p class="muted">Passwords must be at least 12 characters and include uppercase, lowercase, a number and a symbol.</p><form method="post">
<label>Username</label><input name="username" minlength="3" maxlength="40" required autocomplete="username">
<label>Email</label><input type="email" name="email" maxlength="254" required autocomplete="email">
<label>Password</label><input type="password" name="password" required autocomplete="new-password">
<button type="submit">Register</button></form></section>{% endblock %}
